name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # 3. Instala as dependências do projeto web e do Capacitor
      - name: Instalar dependências
        run: |
          npm install

      # 4. Faz o build da aplicação web React + Vite
      - name: Build Web App
        run: |
          npm run build

      # 5. Configura o ambiente Java JDK 17
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Configura o Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 7. Sincroniza os assets web e configurações nativas do Capacitor
      - name: Sincronizar Capacitor Android
        run: |
          npx cap sync android

      # 8. Concede permissão de execução e compila o APK de Debug via Gradle
      - name: Compilar APK com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. Salva o APK gerado como artefato para download
      - name: Upload do APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
